  <script>
    const diasDaSemana = [
      'Segunda-feira',
      'TerÃ§a-feira',
      'Quarta-feira',

    ];

    const opcoesPratos = {
      proteinas: [
        'Frango grelhado',
        'Carne moÃ­da',
        'FilÃ© de tilÃ¡pia',

      ],
      acompanhamentos: [
        'Arroz branco',
        'Arroz integral',
        'FeijÃ£o preto',
        'FeijÃ£o carioca',
        'PurÃª de batata',
        'Batata frita',
        'Farofa',
        'MacarrÃ£o ao molho',
        'Arroz Ã  grega',
        'FeijÃ£o tropeiro',
        'Polenta',
        'Escondidinho',
        'Risoto',
        'Nhoque',
        'Batata assada'
      ],
      saladas: [
        'Salada de alface e tomate',

        'Salada de repolho',
        'Salada caesar',
        'Salada caprese',
        'Salada de rÃºcula',
        'Salada tropical',
        'Salada de cenoura ralada',
        'Salada de beterraba',
        'Salada mista',
        'Tabule',
        'Salada de grÃ£o de bico',
        'Coleslaw',
        'Salada de pepino',
        'Vinagrete'
      ]
    };

    const CHAVE_STORAGE_CARDAPIO = 'cardapioSemanalUltimaGeracao';
    let cardapioAtual = [];
    let arquivoGeradoUrl = null;
    let arquivoGeradoNome = '';

    function obterItemAleatorio(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function normalizarTexto(texto) {
      return texto
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function ingredientesProteina(prato) {
      const nome = normalizarTexto(prato);

      if (nome.includes('frango')) {
        return [{ item: 'Peito de frango', quantidade: 0.22, unidade: 'kg' }];
      }
      if (nome.includes('tilapia') || nome.includes('peixe') || nome.includes('salmao')) {
        return [{ item: 'Peixe', quantidade: 0.24, unidade: 'kg' }];
      }
      if (nome.includes('suina') || nome.includes('bisteca') || nome.includes('costela')) {
        return [{ item: 'Carne suina', quantidade: 0.24, unidade: 'kg' }];
      }

      return [{ item: 'Carne bovina', quantidade: 0.22, unidade: 'kg' }];
    }

    function ingredientesAcompanhamento(prato) {
      const nome = normalizarTexto(prato);

      if (nome.includes('arroz') || nome.includes('risoto')) {
        return [{ item: 'Arroz', quantidade: 0.08, unidade: 'kg' }];
      }
      if (nome.includes('feijao')) {
        return [{ item: 'Feijao', quantidade: 0.07, unidade: 'kg' }];
      }
      if (nome.includes('macarrao') || nome.includes('nhoque')) {
        return [{ item: 'Macarrao/Nhoque', quantidade: 0.1, unidade: 'kg' }];
      }
      if (nome.includes('batata') || nome.includes('pure') || nome.includes('escondidinho')) {
        return [{ item: 'Batata', quantidade: 0.18, unidade: 'kg' }];
      }
      if (nome.includes('polenta')) {
        return [{ item: 'Fuba', quantidade: 0.06, unidade: 'kg' }];
      }
      if (nome.includes('farofa')) {
        return [{ item: 'Farinha de mandioca', quantidade: 0.05, unidade: 'kg' }];
      }

      return [{ item: 'Acompanhamento variado', quantidade: 0.08, unidade: 'kg' }];
    }

    function ingredientesSalada(prato) {
      const nome = normalizarTexto(prato);

      if (nome.includes('repolho') || nome.includes('coleslaw')) {
        return [
          { item: 'Repolho', quantidade: 0.1, unidade: 'kg' },
          { item: 'Cenoura', quantidade: 0.04, unidade: 'kg' }
        ];
      }
      if (nome.includes('cenoura')) {
        return [{ item: 'Cenoura', quantidade: 0.09, unidade: 'kg' }];
      }
      if (nome.includes('beterraba')) {
        return [{ item: 'Beterraba', quantidade: 0.09, unidade: 'kg' }];
      }
      if (nome.includes('pepino')) {
        return [{ item: 'Pepino', quantidade: 0.1, unidade: 'kg' }];
      }
      if (nome.includes('grao de bico')) {
        return [{ item: 'Grao de bico', quantidade: 0.07, unidade: 'kg' }];
      }
      if (nome.includes('tabule')) {
        return [
          { item: 'Trigo para quibe', quantidade: 0.05, unidade: 'kg' },
          { item: 'Tomate', quantidade: 0.06, unidade: 'kg' },
          { item: 'Pepino', quantidade: 0.06, unidade: 'kg' }
        ];
      }
      if (nome.includes('caprese')) {
        return [
          { item: 'Tomate', quantidade: 0.1, unidade: 'kg' },
          { item: 'Mucarela', quantidade: 0.06, unidade: 'kg' }
        ];
      }

      return [
        { item: 'Folhas para salada', quantidade: 0.08, unidade: 'kg' },
        { item: 'Tomate', quantidade: 0.06, unidade: 'kg' }
      ];
    }

    function adicionarIngrediente(lista, ingrediente, pessoas) {
      const chave = `${ingrediente.item}|${ingrediente.unidade}`;

      if (!lista[chave]) {
        lista[chave] = {
          item: ingrediente.item,
          unidade: ingrediente.unidade,
          quantidade: 0
        };
      }

      lista[chave].quantidade += ingrediente.quantidade * pessoas;
    }

    function formatarQuantidade(quantidade, unidade) {
      if (unidade === 'kg' && quantidade < 1) {
        return `${Math.round(quantidade * 1000)} g`;
      }
      if (unidade === 'l' && quantidade < 1) {
        return `${Math.round(quantidade * 1000)} ml`;
      }

      return `${quantidade.toFixed(2)} ${unidade}`;
    }

    function gerarListaCompras(cardapio, pessoas = 2) {
      const itens = {};

      cardapio.forEach(({ refeicao }) => {
        if (refeicao.almocoPronto) {
          return;
        }

        ingredientesProteina(refeicao.proteina).forEach(ingrediente => {
          adicionarIngrediente(itens, ingrediente, pessoas);
        });

        ingredientesAcompanhamento(refeicao.acompanhamento1).forEach(ingrediente => {
          adicionarIngrediente(itens, ingrediente, pessoas);
        });

        ingredientesAcompanhamento(refeicao.acompanhamento2).forEach(ingrediente => {
          adicionarIngrediente(itens, ingrediente, pessoas);
        });

        ingredientesSalada(refeicao.salada).forEach(ingrediente => {
          adicionarIngrediente(itens, ingrediente, pessoas);
        });
      });

      return Object.values(itens).sort((a, b) => a.item.localeCompare(b.item));
    }

    function renderizarListaCompras(cardapio, pessoas = 2) {
      const shoppingListContainer = document.getElementById('shoppingListContainer');
      const lista = gerarListaCompras(cardapio, pessoas);
      const diasComPreparo = cardapio.filter(({ refeicao }) => !refeicao.almocoPronto).length;
      const temAlmocoPronto = cardapio.some(({ refeicao }) => refeicao.almocoPronto);
      const sufixo = temAlmocoPronto ? ' com 1 dia de almoÃ§o pronto.' : '.';

      shoppingListContainer.innerHTML =
        '<div class="shopping-list">' +
        '<h3>âšœ Lista de Compras<\/h3>' +
        '<p>Estimativa para ' + pessoas + ' pessoas: ' + diasComPreparo + ' refeiÃ§Ãµes em casa' + escapeHtml(sufixo) + '<\/p>' +
        '<ul>' +
        lista.map(item =>
          '<li><strong>' + escapeHtml(item.item) + '<\/strong><br>' + escapeHtml(formatarQuantidade(item.quantidade, item.unidade)) + '<\/li>'
        ).join('') +
        '<\/ul>' +
        '<\/div>';
    }

    function salvarCardapio(cardapio) {
      try {
        localStorage.setItem(CHAVE_STORAGE_CARDAPIO, JSON.stringify(cardapio));
      } catch (erro) {
        console.warn('Nao foi possivel salvar o cardapio:', erro);
      }
    }

    function textoRefeicaoValido(texto) {
      if (typeof texto !== 'string') {
        return false;
      }

      if (/[<>{}=;]/.test(texto)) {
        return false;
      }

      if (/\b(function|document|window|const|let|return)\b/i.test(texto)) {
        return false;
      }

      return true;
    }

    function carregarCardapioSalvo() {
      try {
        const conteudo = localStorage.getItem(CHAVE_STORAGE_CARDAPIO);

        if (!conteudo) {
          return null;
        }

        const cardapio = JSON.parse(conteudo);
        const cardapioValido = Array.isArray(cardapio) && cardapio.length > 0 &&
          cardapio.every(item =>
            item &&
            typeof item.dia === 'string' &&
            item.dia.length <= 40 &&
            textoRefeicaoValido(item.dia) &&
            item.refeicao &&
            typeof item.refeicao.proteina === 'string' &&
            item.refeicao.proteina.length <= 120 &&
            textoRefeicaoValido(item.refeicao.proteina) &&
            typeof item.refeicao.acompanhamento1 === 'string' &&
            item.refeicao.acompanhamento1.length <= 120 &&
            textoRefeicaoValido(item.refeicao.acompanhamento1) &&
            typeof item.refeicao.acompanhamento2 === 'string' &&
            item.refeicao.acompanhamento2.length <= 120 &&
            textoRefeicaoValido(item.refeicao.acompanhamento2) &&
            typeof item.refeicao.salada === 'string'
            && item.refeicao.salada.length <= 120 &&
            textoRefeicaoValido(item.refeicao.salada)
          );

        if (!cardapioValido) {
          localStorage.removeItem(CHAVE_STORAGE_CARDAPIO);
          return null;
        }

        return cardapio;
      } catch (erro) {
        console.warn('Nao foi possivel carregar o cardapio salvo:', erro);
        localStorage.removeItem(CHAVE_STORAGE_CARDAPIO);
        return null;
      }
    }

    function gerarOpcoes(lista, selecionado) {
      return lista.map(item => {
        const sel = item === selecionado ? ' selected' : '';
        return '<option value="' + escapeHtml(item) + '"' + sel + '>' + escapeHtml(item) + '<\/option>';
      }).join('');
    }

    function aoAlterarSelecao(indiceDia, campo, valor) {
      if (!cardapioAtual[indiceDia] || cardapioAtual[indiceDia].refeicao.almocoPronto) return;
      cardapioAtual[indiceDia].refeicao[campo] = valor;
      salvarCardapio(cardapioAtual);
      renderizarListaCompras(cardapioAtual, 2);
    }

    function renderizarCardapio(cardapio) {
      const menuContainer = document.getElementById('menuContainer');
      menuContainer.innerHTML = '';
      menuContainer.className = 'menu-grid';

      cardapio.forEach(({ dia, data, refeicao }, indiceDia) => {
        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';
        const dataSuffix = data ? '<span class="day-date">' + escapeHtml(data) + '<\/span>' : '';

        if (refeicao.almocoPronto) {
          dayCard.innerHTML =
            '<div class="day-header">' + escapeHtml(dia) + dataSuffix + '<\/div>' +
            '<div class="meal-section">' +
            '<div class="meal-label">ðŸ± AlmoÃ§o Pronto<\/div>' +
            '<div class="meal-item">Dia sem preparo em casa<\/div>' +
            '<\/div>' +
            '<div class="day-action-note">Dia fixo de almoÃ§o pronto<\/div>';
        } else {
          dayCard.innerHTML =
            '<div class="day-header">' + escapeHtml(dia) + dataSuffix + '<\/div>' +
            '<div class="meal-section">' +
            '<div class="meal-label">ðŸ– Prato Principal<\/div>' +
            '<select class="meal-select" data-dia="' + indiceDia + '" data-campo="proteina">' +
            gerarOpcoes(opcoesPratos.proteinas, refeicao.proteina) +
            '<\/select>' +
            '<\/div>' +
            '<div class="meal-section">' +
            '<div class="meal-label">ðŸš Acompanhamento 1<\/div>' +
            '<select class="meal-select" data-dia="' + indiceDia + '" data-campo="acompanhamento1">' +
            gerarOpcoes(opcoesPratos.acompanhamentos, refeicao.acompanhamento1) +
            '<\/select>' +
            '<\/div>' +
            '<div class="meal-section">' +
            '<div class="meal-label">ðŸš Acompanhamento 2<\/div>' +
            '<select class="meal-select" data-dia="' + indiceDia + '" data-campo="acompanhamento2">' +
            gerarOpcoes(opcoesPratos.acompanhamentos, refeicao.acompanhamento2) +
            '<\/select>' +
            '<\/div>' +
            '<div class="meal-section">' +
            '<div class="meal-label">ðŸ¥— Salada<\/div>' +
            '<select class="meal-select" data-dia="' + indiceDia + '" data-campo="salada">' +
            gerarOpcoes(opcoesPratos.saladas, refeicao.salada) +
            '<\/select>' +
            '<\/div>' +
            '<div class="day-actions">' +
            '<button type="button" class="btn-day-random" onclick="trocarRefeicaoDia(' + indiceDia + ')">ðŸŽ² Trocar dia<\/button>' +
            '<\/div>';
        }

        dayCard.querySelectorAll('.meal-select').forEach(sel => {
          sel.addEventListener('change', function () {
            aoAlterarSelecao(
              parseInt(this.dataset.dia),
              this.dataset.campo,
              this.value
            );
          });
        });

        menuContainer.appendChild(dayCard);
      });

      renderizarListaCompras(cardapio, 2);
    }

    function obterSemanaDoMes(data = new Date()) {
      return Math.ceil(data.getDate() / 7);
    }

    function semanaComAlmocoPronto(data = new Date()) {
      const semana = obterSemanaDoMes(data);
      return semana === 1 || semana === 3;
    }

    function aplicarAlmocoPronto(cardapio, data = new Date()) {
      if (!semanaComAlmocoPronto(data)) {
        return;
      }

      const indiceDia = 2;

      if (!cardapio[indiceDia]) {
        return;
      }

      cardapio[indiceDia].refeicao = {
        proteina: 'AlmoÃ§o pronto',
        acompanhamento1: 'Sem preparo em casa',
        acompanhamento2: 'Sem preparo em casa',
        salada: 'Opcional',
        almocoPronto: true
      };
    }

    function refeicoesIguais(refeicaoA, refeicaoB) {
      return refeicaoA.proteina === refeicaoB.proteina &&
        refeicaoA.acompanhamento1 === refeicaoB.acompanhamento1 &&
        refeicaoA.acompanhamento2 === refeicaoB.acompanhamento2 &&
        refeicaoA.salada === refeicaoB.salada;
    }

    function escapeHtml(texto) {
      return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function limparArquivoGerado() {
      if (arquivoGeradoUrl) {
        URL.revokeObjectURL(arquivoGeradoUrl);
      }

      arquivoGeradoUrl = null;
      arquivoGeradoNome = '';
      atualizarStatusArquivoGerado();
    }

    function atualizarStatusArquivoGerado() {
      const fileStatus = document.getElementById('fileStatus');

      if (!fileStatus) {
        return;
      }

      if (arquivoGeradoUrl) {
        fileStatus.textContent = `Arquivo pronto: ${arquivoGeradoNome}`;
        return;
      }

      fileStatus.textContent = 'Nenhum arquivo gerado nesta sessÃ£o.';
    }

    function gerarConteudoArquivoCompartilhavel(cardapio, pessoas = 2) {
      const lista = gerarListaCompras(cardapio, pessoas);
      const diasComPreparo = cardapio.filter(({ refeicao }) => !refeicao.almocoPronto).length;
      const observacao = cardapio.some(({ refeicao }) => refeicao.almocoPronto)
        ? 'Inclui 1 dia de almoÃ§o pronto.'
        : 'Sem dia de almoÃ§o pronto.';
      const geradoEm = new Date().toLocaleString('pt-BR');

      const cardsHtml = cardapio.map(({ dia, refeicao }) => {
        if (refeicao.almocoPronto) {
          return '<div class="card"><h3>' + escapeHtml(dia) + '<\/h3>' +
            '<p><strong>AlmoÃ§o pronto:<\/strong> Dia sem preparo em casa<\/p><\/div>';
        }

        return '<div class="card"><h3>' + escapeHtml(dia) + '<\/h3>' +
          '<p><strong>Prato principal:<\/strong> ' + escapeHtml(refeicao.proteina) + '<\/p>' +
          '<p><strong>Acompanhamentos:<\/strong> ' + escapeHtml(refeicao.acompanhamento1) + ' | ' + escapeHtml(refeicao.acompanhamento2) + '<\/p>' +
          '<p><strong>Salada:<\/strong> ' + escapeHtml(refeicao.salada) + '<\/p><\/div>';
      }).join('');

      const listaHtml = lista.map(item => {
        const quantidade = formatarQuantidade(item.quantidade, item.unidade);
        return '<li><strong>' + escapeHtml(item.item) + '<\/strong>: ' + escapeHtml(quantidade) + '<\/li>';
      }).join('');

      const css = [
        'body { font-family: Georgia, serif; margin: 20px; color: #2C1810; background: #FDF8F0; }',
        'h1 { margin: 0 0 4px; color: #1B2A4A; }',
        'h2 { color: #1B2A4A; }',
        'p { margin: 4px 0; }',
        '.meta { color: #6B5D52; margin-bottom: 16px; font-style: italic; }',
        '.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }',
        '.card { border: 1px solid #EDE3D2; border-top: 3px solid #C5A55A; border-radius: 4px; padding: 12px; background: white; }',
        '.card h3 { margin-top: 0; color: #1B2A4A; }',
        '.compras { margin-top: 18px; border-top: 2px solid #7B2D3B; padding-top: 12px; }',
        'ul { padding-left: 18px; }'
      ].join('\n');

      return '<!DOCTYPE html>' +
        '<html lang="pt-BR">' +
        '<head>' +
        '<meta charset="UTF-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
        '<title>CardÃ¡pio Semanal â€” Le Cordon Bleu<\/title>' +
        '<style>' + css + '<\/style>' +
        '<\/head>' +
        '<body>' +
        '<h1>âšœ CardÃ¡pio Semanal<\/h1>' +
        '<p class="meta">Gerado em ' + escapeHtml(geradoEm) + '<\/p>' +
        '<div class="grid">' + cardsHtml + '<\/div>' +
        '<div class="compras">' +
        '<h2>Lista de Compras<\/h2>' +
        '<p>Estimativa para ' + pessoas + ' pessoas: ' + diasComPreparo + ' refeiÃ§Ãµes em casa. ' + escapeHtml(observacao) + '<\/p>' +
        '<ul>' + listaHtml + '<\/ul>' +
        '<\/div>' +
        '<\/body>' +
        '<\/html>';
    }

    function gerarArquivoCompartilhavel() {
      if (!Array.isArray(cardapioAtual) || cardapioAtual.length === 0) {
        alert('Gere o cardÃ¡pio antes de criar o arquivo.');
        return;
      }

      if (arquivoGeradoUrl) {
        URL.revokeObjectURL(arquivoGeradoUrl);
      }

      const conteudo = gerarConteudoArquivoCompartilhavel(cardapioAtual, 2);
      const blob = new Blob([conteudo], { type: 'text/html;charset=utf-8' });
      arquivoGeradoUrl = URL.createObjectURL(blob);

      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const dia = String(agora.getDate()).padStart(2, '0');
      const hora = String(agora.getHours()).padStart(2, '0');
      const minuto = String(agora.getMinutes()).padStart(2, '0');
      arquivoGeradoNome = `cardapio-${ano}-${mes}-${dia}-${hora}${minuto}.html`;

      const link = document.createElement('a');
      link.href = arquivoGeradoUrl;
      link.download = arquivoGeradoNome;
      document.body.appendChild(link);
      link.click();
      link.remove();

      atualizarStatusArquivoGerado();
    }

    function abrirArquivoExterno(input) {
      if (!input.files || !input.files[0]) return;

      const arquivo = input.files[0];
      const url = URL.createObjectURL(arquivo);
      window.open(url, '_blank');

      // reset para permitir reabrir o mesmo arquivo
      input.value = '';
    }

    function gerarTextoWhatsApp(cardapio, pessoas = 2) {
      const diasComPreparo = cardapio.filter(({ refeicao }) => !refeicao.almocoPronto).length;
      const lista = gerarListaCompras(cardapio, pessoas);
      const dataGeracao = new Date().toLocaleDateString('pt-BR');

      const linhasCardapio = cardapio.map(({ dia, refeicao }) => {
        if (refeicao.almocoPronto) {
          return `- ${dia}: Almoco pronto`;
        }

        return `- ${dia}: ${refeicao.proteina} | ${refeicao.acompanhamento1} + ${refeicao.acompanhamento2} | ${refeicao.salada}`;
      });

      const linhasCompras = lista.map(item => `- ${item.item}: ${formatarQuantidade(item.quantidade, item.unidade)}`);

      return [
        `Cardapio semanal (${dataGeracao})`,
        '',
        ...linhasCardapio,
        '',
        `Lista de compras (${pessoas} pessoas, ${diasComPreparo} refeicoes em casa):`,
        ...linhasCompras
      ].join('\n');
    }

    function enviarWhatsApp() {
      if (!Array.isArray(cardapioAtual) || cardapioAtual.length === 0) {
        alert('Gere o cardÃ¡pio antes de enviar no WhatsApp.');
        return;
      }

      const mensagem = gerarTextoWhatsApp(cardapioAtual, 2);
      const url = `https://wa.me/?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    }

    function trocarRefeicaoDia(indiceDia) {
      if (!cardapioAtual[indiceDia]) {
        return;
      }

      const refeicaoAtual = cardapioAtual[indiceDia].refeicao;
      if (refeicaoAtual.almocoPronto) {
        return;
      }

      let novaRefeicao = gerarRefeicaoDia();
      let tentativas = 0;

      while (tentativas < 10 && refeicoesIguais(novaRefeicao, refeicaoAtual)) {
        novaRefeicao = gerarRefeicaoDia();
        tentativas++;
      }

      cardapioAtual[indiceDia] = {
        ...cardapioAtual[indiceDia],
        refeicao: novaRefeicao
      };

      renderizarCardapio(cardapioAtual);
      salvarCardapio(cardapioAtual);
      limparArquivoGerado();
    }

    function carregarUltimoCardapio() {
      const cardapioSalvo = carregarCardapioSalvo();

      if (cardapioSalvo) {
        cardapioAtual = cardapioSalvo;
        renderizarCardapio(cardapioAtual);
      }
    }

    function gerarRefeicaoDia() {
      const acomp1 = obterItemAleatorio(opcoesPratos.acompanhamentos);
      const acomp2 = obterItemAleatorio(opcoesPratos.acompanhamentos.filter(a => a !== acomp1));
      return {
        proteina: obterItemAleatorio(opcoesPratos.proteinas),
        acompanhamento1: acomp1,
        acompanhamento2: acomp2,
        salada: obterItemAleatorio(opcoesPratos.saladas)
      };
    }

    function obterDatasProximaSemana() {
      const hoje = new Date();
      const diaSemana = hoje.getDay(); // 0=Dom, 1=Seg, ..., 6=Sab
      // dias atÃ© a prÃ³xima segunda: se hoje Ã© dom(0)->1, seg(1)->7, ter(2)->6, ...
      const diasAteSegunda = diaSemana === 0 ? 1 : (8 - diaSemana);
      const proximaSegunda = new Date(hoje);
      proximaSegunda.setDate(hoje.getDate() + diasAteSegunda);

      const datas = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(proximaSegunda);
        d.setDate(proximaSegunda.getDate() + i);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        datas.push({ nome: diasDaSemana[i], data: dd + '/' + mm });
      }
      return datas;
    }

    function gerarCardapio() {
      const cardapio = [];
      const diasComData = obterDatasProximaSemana();

      for (let i = 0; i < diasComData.length; i++) {
        const refeicao = gerarRefeicaoDia();
        cardapio.push({
          dia: diasComData[i].nome,
          data: diasComData[i].data,
          refeicao: refeicao
        });
      }

      aplicarAlmocoPronto(cardapio);
      cardapioAtual = cardapio;
      renderizarCardapio(cardapioAtual);
      salvarCardapio(cardapioAtual);
      limparArquivoGerado();
    }

    function limparCardapio() {
      const menuContainer = document.getElementById('menuContainer');
      const shoppingListContainer = document.getElementById('shoppingListContainer');
      menuContainer.innerHTML =
        '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="currentColor">' +
        '<path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/>' +
        '<\/svg>' +
        '<h3>Nenhum cardÃ¡pio gerado ainda<\/h3>' +
        '<p>Clique em "Gerar CardÃ¡pio" para comeÃ§ar<\/p>' +
        '<\/div>';
      menuContainer.className = '';
      shoppingListContainer.innerHTML = '';
      cardapioAtual = [];
      localStorage.removeItem(CHAVE_STORAGE_CARDAPIO);
      limparArquivoGerado();
    }

    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(erro => {
          console.warn('Falha ao registrar service worker:', erro);
        });
      });
    }
    document.addEventListener('DOMContentLoaded', () => {
      carregarUltimoCardapio();
      atualizarStatusArquivoGerado();
    });
  </script>
</body>
